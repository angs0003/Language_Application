name: Tests
# Runs on every pull request. Branch protection on main requires this check ("test") to pass before merging.
# Pushes to main are tested again by deploy.yml before anything is published.
on:
  pull_request:
  push:
    branches-ignore: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - name: Phone tests (iPhone 15 Pro and Pixel 9 Pro in Chromium)
        run: |
          npx playwright install --with-deps chromium webkit
          npm run test:phone
      - name: Phone tests (iPhone 15 Pro in WebKit, the engine of Safari)
        run: PW_WEBKIT=1 npm run test:phone
