name: Tests
# Runs on every pull request. Branch protection on main requires this check ("test") to pass before merging.
# Pushes to main are tested again by deploy.yml before anything is published.
on:
  pull_request:
  push:
    branches-ignore: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - name: Phone tests (iPhone 15 Pro and Pixel 9 Pro in Chromium)
        run: |
          npx playwright install --with-deps chromium webkit
          npm run test:phone
      - name: Phone tests (iPhone 15 Pro in WebKit, the engine of Safari)
        run: PW_WEBKIT=1 npm run test:phone
